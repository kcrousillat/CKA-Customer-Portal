<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>CKA Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* CKA brand: Slate Blue #668599, Light Gray #d3d3d3, Light Beige #f2efeb,
   Black, White. Montserrat for headings, Inter for everything else.
   --slate-ink is the slate darkened so it is readable as text on white; the
   brand slate itself does the structural work (bars, rules, buttons). The one
   red is functional - "overdue" - and always comes with words. */
:root{
  --slate:#668599; --slate-ink:#4a6474; --slate-dark:#3f5a6b; --slate-tint:#b4c6d1; --slate-soft:#e8eef2;
  --gray:#d3d3d3; --beige:#f2efeb; --white:#ffffff; --black:#000000;
  --ink:#1a1a1a; --ink-2:#4d4d4d; --muted:#6b6b6b; --rule:#e4e1dc;
  --late:#9e2b21; --late-soft:#f8e8e6; --soon:#7a5a10; --soon-soft:#f7efdc;
  --head:"Montserrat",Arial,sans-serif; --ui:"Inter",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--beige);color:var(--ink);font:14.5px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
a{color:var(--slate-ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* masthead */
.bar{background:var(--white);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{height:34px;width:auto;display:block}
.bar h1{font:700 15px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--slate-ink);margin:0;padding-left:14px;border-left:1px solid var(--gray)}
.bar .sp{flex:1}
.who{color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--gray);border-radius:6px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--slate);color:var(--white)}
.icon-btn{border:1px solid var(--gray);background:var(--white);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}

main{padding:20px 0 60px}
.label{font:700 11px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--slate-ink);margin:0 0 4px}
h2{font:700 19px/1.25 var(--head);margin:0;color:var(--ink)}
.sec{margin-top:28px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--white);border:1px solid var(--rule);border-radius:8px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{background:var(--white);border:1px solid var(--rule);border-radius:8px;padding:14px 14px 12px;text-align:left;cursor:pointer;border-top:3px solid var(--slate)}
.tile:hover{border-color:var(--slate-tint);border-top-color:var(--slate)}
.tile .n{font:700 30px/1 var(--head);color:var(--ink);font-variant-numeric:tabular-nums}
.tile .t{font-size:12.5px;color:var(--ink-2);margin-top:6px;font-weight:500}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile.alert{border-top-color:var(--late)}
.tile.alert .n{color:var(--late)}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile:first-child{grid-column:1/-1}}

/* lists */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-top:1px solid var(--rule);align-items:center}
.row:first-child{border-top:0}
.row .nm{font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.row .nm:hover{color:var(--slate-ink);text-decoration:underline}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.snip{color:var(--ink-2);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.row{grid-template-columns:1fr}.acts{justify-content:flex-start}}
.btn{border:1px solid var(--slate);background:var(--white);color:var(--slate-ink);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--slate-soft)}
.btn.primary{background:var(--slate-ink);border-color:var(--slate-ink);color:var(--white)}
.btn.primary:hover{background:var(--slate-dark)}
.btn.quiet{border-color:var(--gray);color:var(--ink-2);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.more{display:block;width:100%;border:0;border-top:1px solid var(--rule);background:none;padding:10px;color:var(--slate-ink);font-weight:600;cursor:pointer;font-size:13px}
.empty{padding:18px 14px;color:var(--muted);font-size:13.5px}

.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--slate-soft);color:var(--slate-ink);white-space:nowrap}
.pill.gray{background:#efefef;color:var(--ink-2)}
.due{font-size:12px;font-weight:600;white-space:nowrap}
.due.late{color:var(--late)}
.due.soon{color:var(--soon)}
.due.late::before{content:"\25CF  "}

/* pipeline board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--white);border:1px solid var(--rule);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.col h3{font:700 12px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;margin:0;padding:12px 12px 10px;border-bottom:2px solid var(--slate);display:flex;justify-content:space-between;color:var(--ink)}
.col h3 span{color:var(--muted)}
.col .sum{font-size:12px;color:var(--muted);padding:6px 12px 0}
.col ul{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:6px}
.lc{border:1px solid var(--rule);border-radius:6px;padding:9px 10px;cursor:pointer;background:var(--white);text-align:left;width:100%}
.lc:hover{border-color:var(--slate-tint);background:#fbfbfa}
.lc b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc .meta{font-size:12px}

/* charts */
.charts{display:grid;grid-template-columns:3fr 2fr;gap:10px}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
.chart{padding:14px 14px 10px;position:relative}
.chart h3{font:700 13px/1.3 var(--head);margin:0 0 2px}
.chart .cap{font-size:12px;color:var(--muted);margin:0 0 10px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:170px;border-bottom:1px solid var(--gray);padding-top:16px}
.vb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;cursor:default;min-width:0}
.vb i{display:block;width:100%;max-width:34px;background:var(--slate);border-radius:4px 4px 0 0;min-height:2px}
.vb:hover i,.vb:focus i{background:var(--slate-dark)}
.vb em{font-style:normal;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-bottom:3px}
.vlabels{display:flex;gap:6px;margin-top:5px}
.vlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden}
.hbars{display:grid;grid-template-columns:auto 1fr auto;gap:7px 10px;align-items:center;font-size:13px}
.hbars .bar-t{height:14px;background:#f1f1f0;border-radius:0 4px 4px 0;overflow:hidden}
.hbars .bar-t i{display:block;height:100%;background:var(--slate);border-radius:0 4px 4px 0}
.hbars .bar-t i.unk{background:repeating-linear-gradient(135deg,var(--gray) 0 4px,#e6e6e6 4px 8px)}
.hbars .v{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right}
.tip{position:absolute;pointer-events:none;background:var(--black);color:var(--white);font-size:12px;padding:5px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}

/* all-leads table */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input,.tools select{border:1px solid var(--gray);border-radius:6px;padding:7px 10px;background:var(--white);min-width:0}
.tools input{width:220px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:700 11px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;text-align:left;color:var(--white);background:var(--slate);padding:9px 10px}
.tbl th:first-child{border-top-left-radius:7px}.tbl th:last-child{border-top-right-radius:7px}
.tbl td{padding:8px 10px;border-top:1px solid var(--rule);vertical-align:top}
.tbl tr:nth-child(even) td{background:#faf9f7}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--slate-soft)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:700px){.tbl .hide-s{display:none}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--white);z-index:31;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.dh{padding:16px 18px 14px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--white);z-index:1;display:flex;gap:10px;align-items:flex-start}
.dh h2{font-size:20px}
.dh .sp{flex:1}
.db{padding:4px 18px 30px}
.dsec{padding:14px 0;border-bottom:1px solid var(--rule)}
.dsec:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.inq{white-space:pre-wrap;background:var(--beige);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--ink-2);max-height:260px;overflow:auto;margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.form select,.form input,.form textarea{border:1px solid var(--gray);border-radius:6px;padding:8px 10px;font-weight:400;font-size:14px;background:var(--white);width:100%}
.form textarea{min-height:76px;resize:vertical}
.hint{font-weight:400;color:var(--muted);font-size:11.5px}
.save-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.msg{font-size:12.5px;color:var(--muted)}
.msg.err{color:var(--late)}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 0;border-top:1px solid var(--rule);font-size:13px}
.hist li:first-child{border-top:0}
.hist .hm{color:var(--muted);font-size:12px}
@media (max-width:480px){.form{grid-template-columns:1fr}.kv{grid-template-columns:100px 1fr}}

.notice{background:var(--white);border:1px solid var(--rule);border-left:3px solid var(--slate);border-radius:6px;padding:16px;max-width:560px;margin:60px auto}
.notice h2{margin-bottom:6px}
.foot{color:var(--muted);font-size:12px;margin-top:30px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--black);color:var(--white);padding:9px 16px;border-radius:6px;font-size:13px;z-index:40}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <img class="logo" src="__CKA_LOGO__" alt="CKA Construction Group">
    <h1>Leads</h1>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <div class="seg" role="group" aria-label="Whose leads">
      <button type="button" data-scope="all" aria-pressed="true">Everyone</button>
      <button type="button" data-scope="mine" aria-pressed="false">Mine</button>
    </div>
    <button type="button" class="icon-btn" id="refresh" title="Reload from Airtable">Refresh</button>
  </div>
</header>

<main class="wrap" id="app">
  <p class="empty" id="loading">Loading leads&hellip;</p>
</main>

<div id="drawer-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------- */
  /* Settings                                                          */

  // Stages that are still in play. Stage is the field that decides it (Kevin,
  // 19 Nov); Status is left alone.
  var OPEN = ["New", "Qualified", "Proposal Sent", "Negotiating"];
  // The website form puts a budget band into Estimated Value as a code rather
  // than a dollar figure. Kevin confirmed 500 = "$500K - $1M". Any other code
  // below $1,000 is shown as "not stated" until someone says what it means.
  var BUDGET_BANDS = { 500: "$500K–$1M" };
  var REAL_VALUE_MIN = 1000;

  /* ---------------------------------------------------------------- */
  /* State                                                             */

  var qs = new URLSearchParams(location.search);
  var KEY = qs.get("k") || store("get", "cka-leads-k") || "";
  if (qs.get("k")) store("set", "cka-leads-k", qs.get("k"));

  var data = null;
  var scope = store("get", "cka-leads-scope") === "mine" ? "mine" : "all";
  var show = { triage: 8, fu: 8, all: 40 };
  var filter = { q: "", stage: "open" };
  var openId = null;

  function store(op, k, v) {
    try { return op === "get" ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; }
  }

  /* ---------------------------------------------------------------- */
  /* Helpers                                                           */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function ymd(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  var TODAY = ymd(new Date());
  function addDays(s, n) { var d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); }
  function daysBetween(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5); }
  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(s.length === 10 ? s + "T12:00:00" : s);
    var opts = { month: "short", day: "numeric" };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
    return d.toLocaleDateString("en-US", opts);
  }
  function ago(s) {
    var n = daysBetween(s, TODAY);
    if (n <= 0) return "today";
    if (n === 1) return "yesterday";
    if (n < 14) return n + " days ago";
    if (n < 60) return Math.round(n / 7) + " weeks ago";
    return fmtDate(s);
  }
  function money(n) {
    if (n >= 1e6) return "$" + (n / 1e6).toFixed(n % 1e6 ? 2 : 0).replace(/\.?0+$/, "") + "M";
    if (n >= 1e3) return "$" + Math.round(n / 1e3) + "K";
    return "$" + n;
  }
  function budget(l) {
    if (l.value == null) return "";
    if (l.value >= REAL_VALUE_MIN) return money(l.value);
    return BUDGET_BANDS[l.value] || "";
  }
  function first(name) { return String(name || "").split(" ")[0]; }
  // The day a lead came in. Date Entered when someone typed it (rows carried
  // over from the Google Sheet), otherwise when the row was created.
  function received(l) { return l.entered || ymd(new Date(l.created)); }
  function snippet(t) {
    // Website inquiries start "City: message"; keep it, it is useful context.
    return String(t || "").replace(/\s+/g, " ").trim().slice(0, 220);
  }
  function dueTag(d) {
    if (!d) return "";
    var n = daysBetween(TODAY, d);
    if (n < 0) return '<span class="due late">' + (n === -1 ? "1 day" : -n + " days") + " overdue</span>";
    if (n === 0) return '<span class="due soon">Due today</span>';
    if (n <= 7) return '<span class="due soon">Due ' + fmtDate(d) + "</span>";
    return '<span class="due">' + fmtDate(d) + "</span>";
  }
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------------------------------------------------------------- */
  /* Data                                                              */

  function api(path, body) {
    var opts = body
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ k: KEY }, body)) }
      : {};
    var url = body ? path : path + (path.indexOf("?") < 0 ? "?" : "&") + "k=" + encodeURIComponent(KEY);
    return fetch(url, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || "Something went wrong (" + r.status + ")."); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function load(quiet) {
    if (!KEY) return notice("This page needs your personal link", "Open the link Kevin sent you. It ends in ?k= followed by your key. Once opened, this browser remembers it.");
    return api("/api/leads").then(function (j) {
      data = j;
      var logsBy = {};
      j.followUps.forEach(function (f) { (logsBy[f.lead] = logsBy[f.lead] || []).push(f); });
      j.leads.forEach(function (l) {
        l.logs = (logsBy[l.id] || []).sort(function (a, b) {
          return String(b.date || b.created).localeCompare(String(a.date || a.created));
        });
        l.lastContact = l.logs.length ? (l.logs[0].date || l.logs[0].created.slice(0, 10)) : null;
        l.recv = received(l);
      });
      $("#who").textContent = j.me ? "Signed in as " + first(j.me) : "";
      render();
      if (openId) openDrawer(openId);
      if (!quiet) $("#loading") && $("#loading").remove();
    }).catch(function (e) {
      if (e.status === 401) { store("set", "cka-leads-k", ""); return notice("This link is not active", e.message); }
      notice("Could not load the leads", e.message + " Try Refresh in a minute. If it keeps happening, send Kevin a screenshot of this message.");
    });
  }

  function notice(title, body) {
    $("#app").innerHTML = '<div class="notice"><h2>' + esc(title) + "</h2><p>" + esc(body) + "</p></div>";
  }

  function mine(l) { return scope === "all" || l.assigned === data.me; }
  function isOpen(l) { return OPEN.indexOf(l.stage) >= 0; }

  /* ---------------------------------------------------------------- */
  /* Render                                                            */

  function render() {
    var L = data.leads;
    var triage = L.filter(function (l) { return !l.stage; })
      .sort(function (a, b) { return b.recv.localeCompare(a.recv); });
    var open = L.filter(function (l) { return isOpen(l) && mine(l); });
    var overdue = open.filter(function (l) { return l.nextFollowUp && l.nextFollowUp < TODAY; });
    var soon = open.filter(function (l) { return l.nextFollowUp && l.nextFollowUp >= TODAY && l.nextFollowUp <= addDays(TODAY, 7); });
    var noDate = open.filter(function (l) { return !l.nextFollowUp; });
    var monthStart = TODAY.slice(0, 7);
    var thisMonth = L.filter(function (l) { return l.recv.slice(0, 7) === monthStart && mine(l); });
    var won = L.filter(function (l) { return l.stage === "Won" && mine(l); });
    var knownVal = open.reduce(function (s, l) { return s + (l.value >= REAL_VALUE_MIN ? l.value : 0); }, 0);

    var h = "";

    h += '<div class="tiles">';
    h += tile("triage", triage.length, "Waiting for a first look", "No stage set yet", triage.length > 0);
    h += tile("fu", overdue.length, "Follow-ups overdue", noDate.length + " open with no date set", overdue.length > 0);
    h += tile("pipe", open.length, "Open leads", knownVal ? money(knownVal) + " with a real estimate" : "New to negotiating");
    h += tile("flow", thisMonth.length, "Came in this month", new Date().toLocaleDateString("en-US", { month: "long" }));
    h += tile("all", won.length, "Won", "All time");
    h += "</div>";

    /* 1. Triage */
    h += '<section class="sec" id="s-triage"><div class="sec-head"><div><p class="label">01 Triage</p><h2>Waiting for a first look</h2>' +
         "<p>New inquiries nobody has set a stage on. Newest first. Everyone sees these, whatever the toggle says.</p></div></div>";
    h += '<div class="card"><ul class="rows">';
    if (!triage.length) h += '<li class="empty">Nothing waiting. Every lead has a stage.</li>';
    triage.slice(0, show.triage).forEach(function (l) {
      h += '<li class="row"><div><button class="nm" data-open="' + l.id + '">' + esc(l.name) + "</button>" +
           '<div class="meta"><span>' + esc(ago(l.recv)) + "</span>" +
           (l.type ? "<span>" + esc(l.type) + "</span>" : "") +
           (budget(l) ? "<span>" + esc(budget(l)) + "</span>" : "") +
           (l.source ? "<span>" + esc(l.source) + "</span>" : "") + "</div>" +
           (l.notes ? '<div class="snip">' + esc(snippet(l.notes)) + "</div>" : "") + "</div>" +
           '<div class="acts"><button class="btn" data-quick="Qualified" data-id="' + l.id + '">Qualified</button>' +
           '<button class="btn quiet" data-quick="Not Qualified" data-id="' + l.id + '">Not qualified</button>' +
           '<button class="btn quiet" data-open="' + l.id + '">Open</button></div></li>';
    });
    h += "</ul>" + more("triage", triage.length) + "</div></section>";

    /* 2. Follow-ups */
    var fu = overdue.sort(byDue).concat(soon.sort(byDue));
    h += '<section class="sec" id="s-fu"><div class="sec-head"><div><p class="label">02 Follow-ups</p><h2>Who to call</h2>' +
         "<p>Open leads that are overdue or due in the next 7 days.</p></div></div>";
    h += '<div class="card"><ul class="rows">';
    if (!fu.length) h += '<li class="empty">Nothing overdue or due this week' + (scope === "mine" ? " for you" : "") + ".</li>";
    fu.slice(0, show.fu).forEach(function (l) { h += fuRow(l); });
    h += "</ul>" + more("fu", fu.length) + "</div>";
    if (noDate.length) {
      h += '<p class="foot" style="margin-top:8px">' + noDate.length + " open lead" + (noDate.length === 1 ? " has" : "s have") +
           " no next follow-up date, so they can't come up here: " +
           noDate.slice(0, 12).map(function (l) { return '<a href="#" data-open="' + l.id + '">' + esc(l.name) + "</a>"; }).join(", ") +
           (noDate.length > 12 ? " and " + (noDate.length - 12) + " more" : "") + ".</p>";
    }
    h += "</section>";

    /* 3. Pipeline */
    h += '<section class="sec" id="s-pipe"><div class="sec-head"><div><p class="label">03 Pipeline</p><h2>Open leads by stage</h2>' +
         "<p>Tap a lead to update it or log a call.</p></div></div>";
    h += '<div class="board">';
    OPEN.forEach(function (st) {
      var items = open.filter(function (l) { return l.stage === st; }).sort(byDue);
      var v = items.reduce(function (s, l) { return s + (l.value >= REAL_VALUE_MIN ? l.value : 0); }, 0);
      h += '<div class="col"><h3>' + esc(st) + "<span>" + items.length + "</span></h3>" +
           (v ? '<div class="sum">' + money(v) + " estimated</div>" : "") + "<ul>";
      if (!items.length) h += '<li class="empty" style="padding:8px 6px">None</li>';
      items.forEach(function (l) {
        h += '<li><button class="lc" data-open="' + l.id + '"><b>' + esc(l.name) + '</b><div class="meta">' +
             "<span>" + esc(l.assigned ? first(l.assigned) : "Unassigned") + "</span>" +
             (budget(l) ? "<span>" + esc(budget(l)) + "</span>" : "") +
             (l.nextFollowUp ? dueTag(l.nextFollowUp) : '<span class="due">No date</span>') +
             "</div></button></li>";
      });
      h += "</ul></div>";
    });
    h += "</div></section>";

    /* 4. Lead flow */
    h += '<section class="sec" id="s-flow"><div class="sec-head"><div><p class="label">04 Lead flow</p><h2>Where leads come from</h2></div></div>';
    h += '<div class="charts"><div class="card chart" id="c-month">' + monthChart() + "</div>" +
         '<div class="card chart">' + sourceChart() + "</div></div></section>";

    /* 5. All leads */
    h += '<section class="sec" id="s-all"><div class="sec-head"><div><p class="label">05 All leads</p><h2>Find a lead</h2></div>' +
         '<div class="tools"><input type="search" id="q" placeholder="Search name, company, email" value="' + esc(filter.q) + '">' +
         '<select id="stagef"><option value="open">Open stages</option><option value="">All stages</option><option value="(none)">No stage</option>' +
         data.choices.stage.map(function (s) { return "<option" + (filter.stage === s ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") +
         "</select></div></div>";
    h += '<div class="card" id="all-wrap">' + allTable() + "</div></section>";

    h += '<p class="foot">Live from the CKA Live Leads base in Airtable. Updated ' +
         new Date(data.generatedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + ".</p>";

    $("#app").innerHTML = h;
    var sf = $("#stagef"); if (sf) sf.value = filter.stage;
    wireCharts();
  }

  function byDue(a, b) { return String(a.nextFollowUp || "9999").localeCompare(String(b.nextFollowUp || "9999")); }
  function tile(target, n, t, s, alert) {
    return '<button class="tile' + (alert ? " alert" : "") + '" data-jump="s-' + target + '"><div class="n">' + n +
           '</div><div class="t">' + esc(t) + '</div><div class="s">' + esc(s) + "</div></button>";
  }
  function more(which, total) {
    if (total <= show[which]) return "";
    return '<button class="more" data-more="' + which + '">Show ' + Math.min(total - show[which], 40) + " more of " + total + "</button>";
  }
  function fuRow(l) {
    return '<li class="row"><div><button class="nm" data-open="' + l.id + '">' + esc(l.name) + "</button>" +
      '<div class="meta"><span class="pill">' + esc(l.stage) + "</span>" +
      "<span>" + esc(l.assigned ? first(l.assigned) : "Unassigned") + "</span>" +
      (l.lastContact ? "<span>Last contact " + esc(ago(l.lastContact)) + "</span>" : "<span>No calls logged</span>") +
      (l.phone ? '<span><a href="tel:' + esc(l.phone) + '">' + esc(l.phone) + "</a></span>" : "") +
      "</div></div>" +
      '<div class="acts">' + dueTag(l.nextFollowUp) + '<button class="btn" data-log="' + l.id + '">Log a call</button></div></li>';
  }

  function monthChart() {
    var months = [], d = new Date(); d.setDate(1);
    for (var i = 11; i >= 0; i--) {
      var m = new Date(d.getFullYear(), d.getMonth() - i, 1);
      months.push({ key: ymd(m).slice(0, 7), label: m.toLocaleDateString("en-US", { month: "short" }), n: 0 });
    }
    data.leads.forEach(function (l) {
      if (!mine(l)) return;
      var mm = months.find(function (x) { return x.key === l.recv.slice(0, 7); });
      if (mm) mm.n++;
    });
    var max = Math.max.apply(null, months.map(function (m) { return m.n; }).concat([1]));
    var bars = months.map(function (m) {
      return '<div class="vb" tabindex="0" data-tip="' + esc(m.label + " " + m.key.slice(0, 4) + ": " + m.n + " lead" + (m.n === 1 ? "" : "s")) + '">' +
             (m.n ? "<em>" + m.n + "</em>" : "") + '<i style="height:' + (m.n / max * 100) + '%"></i></div>';
    }).join("");
    var labels = months.map(function (m) { return "<span>" + esc(m.label) + "</span>"; }).join("");
    return "<h3>Leads per month</h3><p class=\"cap\">Last 12 months, by the date each lead came in" +
           (scope === "mine" ? ", assigned to you" : "") + ".</p>" +
           '<div class="vbars">' + bars + '</div><div class="vlabels">' + labels + "</div>";
  }

  function sourceChart() {
    var counts = {}, total = 0;
    data.leads.forEach(function (l) {
      if (!mine(l)) return;
      var k = l.source || "Not recorded"; counts[k] = (counts[k] || 0) + 1; total++;
    });
    var rows = Object.keys(counts).map(function (k) { return { k: k, n: counts[k] }; })
      // "Not recorded" always last so it never looks like the top channel.
      .sort(function (a, b) { return (a.k === "Not recorded") - (b.k === "Not recorded") || b.n - a.n; });
    var max = Math.max.apply(null, rows.map(function (r) { return r.n; }).concat([1]));
    var h = "<h3>Lead source</h3><p class=\"cap\">All leads" + (scope === "mine" ? " assigned to you" : "") +
            ". Set the source when you triage a lead so this fills in.</p><div class=\"hbars\">";
    rows.forEach(function (r) {
      h += "<span>" + esc(r.k) + '</span><div class="bar-t" title="' + esc(r.k + ": " + r.n + " (" + Math.round(r.n / total * 100) + "%)") + '"><i' +
           (r.k === "Not recorded" ? ' class="unk"' : "") + ' style="width:' + (r.n / max * 100) + '%"></i></div><span class="v">' + r.n + "</span>";
    });
    return h + "</div>";
  }

  function wireCharts() {
    var box = $("#c-month"); if (!box) return;
    var tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip);
    box.querySelectorAll(".vb").forEach(function (b) {
      function on() {
        var r = b.getBoundingClientRect(), br = box.getBoundingClientRect(), bar = b.querySelector("i").getBoundingClientRect();
        tip.textContent = b.getAttribute("data-tip"); tip.hidden = false;
        tip.style.left = (r.left - br.left + r.width / 2) + "px";
        tip.style.top = (bar.top - br.top - 22) + "px";
      }
      b.addEventListener("mouseenter", on); b.addEventListener("focus", on);
      b.addEventListener("mouseleave", function () { tip.hidden = true; });
      b.addEventListener("blur", function () { tip.hidden = true; });
    });
  }

  function allTable() {
    var q = filter.q.toLowerCase();
    var rows = data.leads.filter(function (l) {
      if (!mine(l)) return false;
      if (filter.stage === "open" && !isOpen(l)) return false;
      if (filter.stage === "(none)" && l.stage) return false;
      if (filter.stage && filter.stage !== "open" && filter.stage !== "(none)" && l.stage !== filter.stage) return false;
      if (q && (l.name + " " + l.company + " " + l.email + " " + l.phone).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return b.recv.localeCompare(a.recv); });
    if (!rows.length) return '<p class="empty">No leads match.</p>';
    var h = '<table class="tbl"><thead><tr><th>Lead</th><th>Stage</th><th class="hide-s">Owner</th><th class="hide-s">Came in</th><th class="r">Budget</th></tr></thead><tbody>';
    rows.slice(0, show.all).forEach(function (l) {
      h += '<tr data-open="' + l.id + '"><td><b>' + esc(l.name) + "</b>" + (l.company ? '<div class="meta">' + esc(l.company) + "</div>" : "") + "</td>" +
           "<td>" + (l.stage ? '<span class="pill' + (isOpen(l) ? "" : " gray") + '">' + esc(l.stage) + "</span>" : '<span class="pill gray">No stage</span>') + "</td>" +
           '<td class="hide-s">' + esc(l.assigned ? first(l.assigned) : "") + "</td>" +
           '<td class="hide-s">' + esc(fmtDate(l.recv)) + "</td>" +
           '<td class="r">' + esc(budget(l)) + "</td></tr>";
    });
    return h + "</tbody></table>" + more("all", rows.length);
  }

  /* ---------------------------------------------------------------- */
  /* Drawer                                                            */

  function opts(list, cur, blank) {
    return (blank ? '<option value="">' + esc(blank) + "</option>" : "") +
      list.map(function (o) { return "<option" + (o === cur ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("");
  }

  function openDrawer(id, focusLog) {
    var l = data.leads.find(function (x) { return x.id === id; });
    if (!l) return closeDrawer();
    openId = id;
    var C = data.choices;
    var band = l.value != null && l.value < REAL_VALUE_MIN;
    var h = '<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">' +
      '<div class="dh"><div><p class="label">' + esc(l.stage || "No stage yet") + '</p><h2 id="dtitle">' + esc(l.name) + "</h2></div>" +
      '<span class="sp"></span><button class="icon-btn" data-close aria-label="Close">Close</button></div><div class="db">';

    h += '<div class="dsec"><dl class="kv">' +
      (l.company ? "<dt>Company</dt><dd>" + esc(l.company) + "</dd>" : "") +
      (l.phone ? '<dt>Phone</dt><dd><a href="tel:' + esc(l.phone) + '">' + esc(l.phone) + "</a></dd>" : "") +
      (l.email ? '<dt>Email</dt><dd><a href="mailto:' + esc(l.email) + '">' + esc(l.email) + "</a></dd>" : "") +
      (l.email2 ? '<dt>Email 2</dt><dd><a href="mailto:' + esc(l.email2) + '">' + esc(l.email2) + "</a></dd>" : "") +
      "<dt>Came in</dt><dd>" + esc(fmtDate(l.recv)) + (daysBetween(l.recv, TODAY) < 60 ? " (" + esc(ago(l.recv)) + ")" : "") + "</dd>" +
      (l.enteredBy ? "<dt>Entered by</dt><dd>" + esc(l.enteredBy) + "</dd>" : "") +
      (budget(l) ? "<dt>Budget</dt><dd>" + esc(budget(l)) + (band ? ' <span class="hint">(website form band)</span>' : "") + "</dd>" : "") +
      (l.sourceNote ? "<dt>Source note</dt><dd>" + esc(l.sourceNote) + "</dd>" : "") +
      "</dl></div>";

    if (l.notes) h += '<div class="dsec"><p class="label">Inquiry and notes</p><pre class="inq">' + esc(l.notes) + "</pre></div>";

    h += '<div class="dsec"><p class="label">Update</p><form class="form" id="f-upd">' +
      '<label>Stage<select name="stage">' + opts(C.stage, l.stage, "No stage") + "</select></label>" +
      '<label>Assigned to<select name="assigned">' + opts(C.assigned, l.assigned, "Unassigned") + "</select></label>" +
      '<label>Lead source<select name="source">' + opts(C.source, l.source, "Not recorded") + "</select></label>" +
      '<label>Project type<select name="type">' + opts(C.type, l.type, "Not set") + "</select></label>" +
      '<label>Estimated value ($)<input name="value" inputmode="numeric" value="' + (l.value == null ? "" : l.value) + '">' +
      (band ? '<span class="hint">' + esc(BUDGET_BANDS[l.value] ? l.value + " is the form's " + BUDGET_BANDS[l.value] + " band. Replace it with a real figure once you have one." : "This is a website-form code, not a dollar figure.") + "</span>" : "") + "</label>" +
      '<label>Next follow-up<input type="date" name="nextFollowUp" value="' + esc(l.nextFollowUp || "") + '"></label>' +
      '<div class="full save-row"><button class="btn primary" type="submit">Save changes</button><span class="msg" id="m-upd"></span></div>' +
      "</form></div>";

    h += '<div class="dsec" id="log-sec"><p class="label">Log a call or email</p><form class="form" id="f-log">' +
      '<label>What happened<select name="outcome">' + opts(C.outcome, "", "Choose…") + "</select></label>" +
      '<label>Date<input type="date" name="date" value="' + TODAY + '"></label>' +
      '<label class="full">Notes<textarea name="notes" placeholder="What was said, what they need next"></textarea></label>' +
      '<label>Next follow-up<input type="date" name="nextFollowUp" value="' + esc(l.nextFollowUp && l.nextFollowUp > TODAY ? l.nextFollowUp : "") + '">' +
      '<span class="hint">Leave empty to keep the current date.</span></label>' +
      '<div class="full save-row"><button class="btn primary" type="submit">Save to log</button><span class="msg" id="m-log"></span></div>' +
      "</form></div>";

    h += '<div class="dsec"><p class="label">History</p>';
    if (!l.logs.length) h += '<p class="empty" style="padding:6px 0">Nothing logged yet.</p>';
    else {
      h += '<ul class="hist">';
      l.logs.forEach(function (f) {
        h += "<li><div><b>" + esc(f.outcome || "Note") + '</b> <span class="hm">' + esc(fmtDate(f.date || f.created)) +
             (f.by ? " · " + esc(first(f.by)) : "") + "</span></div>" + (f.notes ? "<div>" + esc(f.notes) + "</div>" : "") + "</li>";
      });
      h += "</ul>";
    }
    h += "</div></div></aside>";

    var root = $("#drawer-root");
    var wasOpen = !!root.innerHTML;
    root.innerHTML = h;
    document.body.style.overflow = "hidden";
    if (focusLog) { $("#log-sec").scrollIntoView(); $("#f-log select").focus(); }
    else if (!wasOpen) $(".drawer .icon-btn").focus();

    $("#f-upd").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var f = ev.target, body = {};
      ["stage", "assigned", "source", "type", "nextFollowUp"].forEach(function (k) {
        if ((f[k].value || "") !== (l[k] || "")) body[k] = f[k].value;
      });
      var v = f.value.value.replace(/[$,\s]/g, "");
      if (v !== (l.value == null ? "" : String(l.value))) body.value = v;
      if (!Object.keys(body).length) { $("#m-upd").textContent = "Nothing changed."; return; }
      save("/api/leads/" + l.id + "/update", body, f, "#m-upd", "Saved.");
    });
    $("#f-log").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var f = ev.target, body = { outcome: f.outcome.value, notes: f.notes.value, date: f.date.value };
      if (f.nextFollowUp.value) body.nextFollowUp = f.nextFollowUp.value;
      if (!body.outcome && !body.notes.trim()) { $("#m-log").textContent = "Pick what happened or write a note."; return; }
      save("/api/leads/" + l.id + "/followup", body, f, "#m-log", "Logged.");
    });
  }

  function save(path, body, form, msgSel, done) {
    var btn = form.querySelector("button[type=submit]"); btn.disabled = true;
    var m = $(msgSel); m.className = "msg"; m.textContent = "Saving…";
    api(path, body).then(function () {
      toast(done);
      return load(true);
    }).catch(function (e) {
      m.className = "msg err"; m.textContent = e.message; btn.disabled = false;
    });
  }

  function closeDrawer() {
    openId = null; $("#drawer-root").innerHTML = ""; document.body.style.overflow = "";
  }

  /* ---------------------------------------------------------------- */
  /* Events                                                            */

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-open],[data-log],[data-close],[data-quick],[data-more],[data-jump],[data-scope]");
    if (!t) return;
    if (t.hasAttribute("data-close")) return closeDrawer();
    if (t.hasAttribute("data-open")) { ev.preventDefault(); return openDrawer(t.getAttribute("data-open")); }
    if (t.hasAttribute("data-log")) return openDrawer(t.getAttribute("data-log"), true);
    if (t.hasAttribute("data-jump")) { var s = document.getElementById(t.getAttribute("data-jump")); if (s) s.scrollIntoView({ behavior: "smooth" }); return; }
    if (t.hasAttribute("data-more")) { var w = t.getAttribute("data-more"); show[w] += 40; return render(); }
    if (t.hasAttribute("data-scope")) {
      scope = t.getAttribute("data-scope"); store("set", "cka-leads-scope", scope);
      document.querySelectorAll("[data-scope]").forEach(function (b) { b.setAttribute("aria-pressed", String(b === t)); });
      return data && render();
    }
    if (t.hasAttribute("data-quick")) {
      var id = t.getAttribute("data-id"), stage = t.getAttribute("data-quick");
      t.disabled = true;
      var body = { stage: stage };
      // Qualifying a lead from the triage list hands it to whoever qualified it.
      var lead = data.leads.find(function (x) { return x.id === id; });
      if (stage === "Qualified" && lead && !lead.assigned && data.choices.assigned.indexOf(data.me) >= 0) body.assigned = data.me;
      api("/api/leads/" + id + "/update", body)
        .then(function () { toast(lead.name + ": " + stage + (body.assigned ? ", assigned to you" : "")); return load(true); })
        .catch(function (e) { t.disabled = false; toast(e.message); });
    }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && openId) closeDrawer(); });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "q") { filter.q = ev.target.value; show.all = 40; $("#all-wrap").innerHTML = allTable(); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "stagef") { filter.stage = ev.target.value; show.all = 40; $("#all-wrap").innerHTML = allTable(); }
  });
  $("#refresh").addEventListener("click", function () { load(true).then(function () { toast("Up to date."); }); });
  document.querySelectorAll("[data-scope]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-scope") === scope)); });

  load();
})();
</script>
</body>
</html>
